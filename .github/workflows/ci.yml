name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: Replay saved evaluation
        run: evidence-gate --suite examples/suite.json --corpus examples/documents.jsonl --predictions examples/predictions.json --output local-results/replay
      - name: Verify corrupted evidence fails the gate
        run: |
          python scripts/corrupt_predictions.py
          set +e
          evidence-gate --suite examples/suite.json --corpus examples/documents.jsonl --predictions local-results/corrupted.json --output local-results/corrupted
          status=$?
          set -e
          test "$status" -eq 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evaluation-${{ matrix.python }}
          path: local-results/
